name: Publish Daily Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Detect pending release notes
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          V2_BOOTSTRAP_TAG: v0.34.2
        run: |
          published_tags_output="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )
          mapfile -t published_tags <<< "$published_tags_output"
          latest_v1_tag=""
          latest_v2_tag=""
          for tag in "${published_tags[@]}"; do
            if [ -z "$latest_v1_tag" ] && [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_v1_tag="$tag"
            elif [ -z "$latest_v2_tag" ] && [[ "$tag" =~ ^v2-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_v2_tag="$tag"
            fi
            if [ -n "$latest_v1_tag" ] && [ -n "$latest_v2_tag" ]; then
              break
            fi
          done
          if [ -z "$latest_v1_tag" ]; then
            echo "No published stable V1 release exists; refusing to infer the release range." >&2
            exit 1
          fi
          git rev-parse "$latest_v1_tag" >/dev/null 2>&1 || {
            echo "Published V1 release tag $latest_v1_tag does not exist in the checkout." >&2
            exit 1
          }
          if [ -z "$latest_v2_tag" ]; then
            git rev-parse "$V2_BOOTSTRAP_TAG" >/dev/null 2>&1 || {
              echo "V2 bootstrap tag $V2_BOOTSTRAP_TAG does not exist." >&2
              exit 1
            }
            latest_v2_tag="$V2_BOOTSTRAP_TAG"
          fi
          git rev-parse "$latest_v2_tag" >/dev/null 2>&1 || {
            echo "Published V2 release tag $latest_v2_tag does not exist in the checkout." >&2
            exit 1
          }

          mapfile -t v1_candidates < <(git diff --name-only --diff-filter=A "$latest_v1_tag" "$RELEASE_SHA" -- .release-notes | grep -Ev '/README\.md$' || true)
          mapfile -t v2_candidates < <(git diff --name-only --diff-filter=A "$latest_v2_tag" "$RELEASE_SHA" -- .release-notes | grep -Ev '/README\.md$' || true)
          declare -a v1_notes=()
          declare -a v2_notes=()
          declare -A checked_notes=()

          for note in "${v1_candidates[@]}" "${v2_candidates[@]}"; do
            [ -n "$note" ] || continue
            if [ -z "${checked_notes[$note]+x}" ]; then
              node scripts/release-notes.mjs check-file "$note"
              checked_notes["$note"]=1
            fi
          done
          for note in "${v1_candidates[@]}"; do
            target="$(node scripts/release-notes.mjs target "$note")"
            if [ "$target" = "v1" ] || [ "$target" = "both" ]; then
              v1_notes+=("$note")
            fi
          done
          for note in "${v2_candidates[@]}"; do
            target="$(node scripts/release-notes.mjs target "$note")"
            if [ "$target" = "v2" ] || [ "$target" = "both" ]; then
              v2_notes+=("$note")
            fi
          done

          if [ "${#v1_notes[@]}" -eq 0 ] && [ "${#v2_notes[@]}" -eq 0 ]; then
            echo "No unreleased user-facing changes; skipping application release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v1_publish=false" >> "$GITHUB_OUTPUT"
            echo "v2_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "${#v1_notes[@]}" -gt 0 ]; then
            v1_note_file="$RUNNER_TEMP/agent-recall-v1-note.md"
            node scripts/release-notes.mjs combine --target v1 "${v1_notes[@]}" > "$v1_note_file"
            echo "v1_publish=true" >> "$GITHUB_OUTPUT"
            echo "v1_note_file=$v1_note_file" >> "$GITHUB_OUTPUT"
          else
            echo "v1_publish=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#v2_notes[@]}" -gt 0 ]; then
            v2_note_file="$RUNNER_TEMP/agent-recall-v2-note.md"
            node scripts/release-notes.mjs combine --target v2 "${v2_notes[@]}" > "$v2_note_file"
            echo "v2_publish=true" >> "$GITHUB_OUTPUT"
            echo "v2_note_file=$v2_note_file" >> "$GITHUB_OUTPUT"
          else
            echo "v2_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute V1 release version
        if: steps.pending.outputs.v1_publish == 'true'
        id: v1_version
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_FILE: ${{ steps.pending.outputs.v1_note_file }}
          MERGED_SHA: ${{ github.sha }}
        working-directory: apps/main-1.0
        run: node scripts/compute-release-version.mjs

      - name: Compute V2 release version
        if: steps.pending.outputs.v2_publish == 'true'
        id: v2_version
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_FILE: ${{ steps.pending.outputs.v2_note_file }}
          MERGED_SHA: ${{ github.sha }}
        working-directory: apps/main-2.0
        run: node scripts/compute-release-version.mjs

      - name: Install dependencies
        if: steps.pending.outputs.publish == 'true'
        run: |
          npm ci
          npm run setup

      - name: Test and build
        if: steps.pending.outputs.publish == 'true'
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Build release assets
        if: steps.pending.outputs.publish == 'true'
        env:
          V1_NOTE_FILE: ${{ steps.pending.outputs.v1_note_file }}
          V1_VERSION: ${{ steps.v1_version.outputs.version }}
          V1_RELEASE_REQUIRED: ${{ steps.v1_version.outputs.release_required }}
          V2_NOTE_FILE: ${{ steps.pending.outputs.v2_note_file }}
          V2_VERSION: ${{ steps.v2_version.outputs.version }}
          V2_RELEASE_REQUIRED: ${{ steps.v2_version.outputs.release_required }}
        run: |
          if [ "$V1_RELEASE_REQUIRED" = "true" ]; then
            mkdir -p release/v1
            v1_package_file="$(cd apps/main-1.0 && node scripts/pack-release.mjs --pack-destination "$GITHUB_WORKSPACE/release/v1")"
            node apps/main-1.0/scripts/create-release-assets.mjs \
              --note "$V1_NOTE_FILE" \
              --version "$V1_VERSION" \
              --package "$GITHUB_WORKSPACE/release/v1/$v1_package_file" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/release/v1"
            node apps/main-1.0/scripts/create-release-assets.mjs \
              --validate \
              --version "$V1_VERSION" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/release/v1"
          fi

          if [ "$V2_RELEASE_REQUIRED" = "true" ]; then
            mkdir -p release/v2
            v2_package_file="$(cd apps/main-2.0 && node scripts/pack-release.mjs --pack-destination "$GITHUB_WORKSPACE/release/v2")"
            node apps/main-2.0/scripts/create-release-assets.mjs \
              --note "$V2_NOTE_FILE" \
              --version "$V2_VERSION" \
              --package "$GITHUB_WORKSPACE/release/v2/$v2_package_file" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/release/v2"
            node apps/main-2.0/scripts/create-release-assets.mjs \
              --validate \
              --version "$V2_VERSION" \
              --repository "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/release/v2"
          fi

      - name: Publish V1 GitHub Release
        if: steps.pending.outputs.v1_publish == 'true' && steps.v1_version.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V1_TAG: ${{ steps.v1_version.outputs.tag }}
          V1_VERSION: ${{ steps.v1_version.outputs.version }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse "$V1_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$V1_TAG" "$MERGED_SHA" -m "AgentRecall $V1_TAG"
            git push origin "$V1_TAG"
          fi
          if release_is_draft="$(gh release view "$V1_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$release_is_draft" != "true" ]; then
              echo "Release $V1_TAG already exists and is published; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$V1_TAG" --title "AgentRecall $V1_TAG" --notes-file release/v1/release-notes.md --latest
          else
            gh release create "$V1_TAG" --draft --verify-tag --title "AgentRecall $V1_TAG" --notes-file release/v1/release-notes.md --latest
          fi
          gh release upload "$V1_TAG" release/v1/*.tgz release/v1/*.sha256 release/v1/update.json --clobber
          verify_directory="$(mktemp -d)"
          trap 'rm -rf "$verify_directory"' EXIT
          gh release download "$V1_TAG" \
            --pattern "agent-recall-${V1_VERSION}.tgz" \
            --pattern "agent-recall-${V1_VERSION}.tgz.sha256" \
            --pattern "agent-recall.tgz" \
            --pattern "agent-recall.tgz.sha256" \
            --pattern "update.json" \
            --dir "$verify_directory"
          node apps/main-1.0/scripts/create-release-assets.mjs \
            --validate \
            --version "$V1_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$verify_directory"
          gh release edit "$V1_TAG" --draft=false --latest

      - name: Publish V2 GitHub Release
        if: steps.pending.outputs.v2_publish == 'true' && steps.v2_version.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V2_TAG: ${{ steps.v2_version.outputs.tag }}
          V2_VERSION: ${{ steps.v2_version.outputs.version }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse "$V2_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$V2_TAG" "$MERGED_SHA" -m "agent-recall-v2 v${V2_VERSION}"
            git push origin "$V2_TAG"
          fi
          if release_is_draft="$(gh release view "$V2_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$release_is_draft" != "true" ]; then
              echo "Release $V2_TAG already exists and is published; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$V2_TAG" --title "agent-recall-v2 v${V2_VERSION}" --notes-file release/v2/release-notes-v2.md --latest=false
          else
            gh release create "$V2_TAG" --draft --verify-tag --title "agent-recall-v2 v${V2_VERSION}" --notes-file release/v2/release-notes-v2.md --latest=false
          fi
          gh release upload "$V2_TAG" release/v2/*.tgz release/v2/*.sha256 release/v2/update-v2.json --clobber
          verify_directory="$(mktemp -d)"
          trap 'rm -rf "$verify_directory"' EXIT
          gh release download "$V2_TAG" \
            --pattern "agent-recall-v2-${V2_VERSION}.tgz" \
            --pattern "agent-recall-v2-${V2_VERSION}.tgz.sha256" \
            --pattern "agent-recall-v2.tgz" \
            --pattern "agent-recall-v2.tgz.sha256" \
            --pattern "update-v2.json" \
            --dir "$verify_directory"
          node apps/main-2.0/scripts/create-release-assets.mjs \
            --validate \
            --version "$V2_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$verify_directory"
          gh release edit "$V2_TAG" --draft=false --latest=false
