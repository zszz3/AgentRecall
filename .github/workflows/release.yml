name: Publish Daily Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    # Releases are published from this repository only. A fork carries no
    # release tags, so scheduled runs must skip there rather than fail.
    if: github.repository == 'zszz3/AgentRecall'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Detect pending release notes
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          published_tags_output="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          mapfile -t published_tags <<< "$published_tags_output"
          latest_tag=""
          for tag in "${published_tags[@]}"; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done
          if [ -z "$latest_tag" ]; then
            echo "No published stable release exists; refusing to infer the release range." >&2
            exit 1
          fi
          git rev-parse "$latest_tag" >/dev/null 2>&1 || {
            echo "Published release tag $latest_tag does not exist in the checkout." >&2
            exit 1
          }

          mapfile -t pending_notes < <(git diff --name-only --diff-filter=A "$latest_tag" "$RELEASE_SHA" -- .release-notes | grep -Ev '/README\.md$' || true)
          declare -a release_notes=()
          for note in "${pending_notes[@]}"; do
            [ -n "$note" ] || continue
            node scripts/release-notes.mjs check-file "$note"
            release_notes+=("$note")
          done

          if [ "${#release_notes[@]}" -eq 0 ]; then
            echo "No unreleased user-facing changes; skipping application release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          note_file="$RUNNER_TEMP/agent-recall-note.md"
          node scripts/release-notes.mjs combine "${release_notes[@]}" > "$note_file"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "note_file=$note_file" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        if: steps.pending.outputs.publish == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_FILE: ${{ steps.pending.outputs.note_file }}
          MERGED_SHA: ${{ github.sha }}
        working-directory: apps/main-2.0
        run: node scripts/compute-release-version.mjs

      - name: Install dependencies
        if: steps.pending.outputs.publish == 'true' && steps.version.outputs.release_required == 'true'
        run: |
          npm ci
          npm run setup

      - name: Test and build
        if: steps.pending.outputs.publish == 'true' && steps.version.outputs.release_required == 'true'
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Build release assets
        if: steps.pending.outputs.publish == 'true' && steps.version.outputs.release_required == 'true'
        env:
          NOTE_FILE: ${{ steps.pending.outputs.note_file }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          package_file="$(cd apps/main-2.0 && node scripts/pack-release.mjs --pack-destination "$GITHUB_WORKSPACE/release")"
          node apps/main-2.0/scripts/create-release-assets.mjs \
            --note "$NOTE_FILE" \
            --version "$RELEASE_VERSION" \
            --package "$GITHUB_WORKSPACE/release/$package_file" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$GITHUB_WORKSPACE/release"
          node apps/main-2.0/scripts/create-release-assets.mjs \
            --validate \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$GITHUB_WORKSPACE/release"

      - name: Publish GitHub Release
        if: steps.pending.outputs.publish == 'true' && steps.version.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$MERGED_SHA" -m "AgentRecall $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$release_is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is published; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "AgentRecall $RELEASE_TAG" --notes-file release/release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "AgentRecall $RELEASE_TAG" --notes-file release/release-notes.md --latest
          fi
          gh release upload "$RELEASE_TAG" release/*.tgz release/*.sha256 release/update.json --clobber
          verify_directory="$(mktemp -d)"
          trap 'rm -rf "$verify_directory"' EXIT
          gh release download "$RELEASE_TAG" \
            --pattern "agent-recall-${RELEASE_VERSION}.tgz" \
            --pattern "agent-recall-${RELEASE_VERSION}.tgz.sha256" \
            --pattern "agent-recall.tgz" \
            --pattern "agent-recall.tgz.sha256" \
            --pattern "update.json" \
            --dir "$verify_directory"
          node apps/main-2.0/scripts/create-release-assets.mjs \
            --validate \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$verify_directory"
          gh release edit "$RELEASE_TAG" --draft=false --latest
