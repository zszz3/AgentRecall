<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>快速搜索会话</title>
    <script>
      (() => {
        // Mirrors readStoredTheme and resolveTheme in src/theme.ts; the main window stores the choice.
        let mode = "system";
        try {
          const stored = localStorage.getItem("agent-recall-theme");
          mode = stored === "light" || stored === "dark" ? stored : stored === "warm" ? "light" : "system";
        } catch {}
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/quick-search-main.tsx"></script>
  </body>
</html>
